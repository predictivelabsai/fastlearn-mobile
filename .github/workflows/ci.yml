name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate mocks and serialization code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    name: Build signed Android release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required signing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            "storePassword=$STORE_PASSWORD" \
            "keyPassword=$KEY_PASSWORD" \
            "keyAlias=$KEY_ALIAS" \
            "storeFile=upload-keystore.jks" \
            > android/key.properties

      - name: Choose Play-compatible version code
        id: version
        run: |
          code=$(date -u +%s)
          if [ "$code" -gt 2100000000 ]; then
            echo "Generated version code exceeds Google Play's limit" >&2
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          FASTLEARN_REQUIRE_RELEASE_SIGNING: "true"
        run: flutter build apk --release --build-number=${{ steps.version.outputs.code }} --dart-define=API_BASE_URL=https://fastlearn.fun/api/v1

      - name: Build App Bundle
        env:
          FASTLEARN_REQUIRE_RELEASE_SIGNING: "true"
        run: flutter build appbundle --release --build-number=${{ steps.version.outputs.code }} --dart-define=API_BASE_URL=https://fastlearn.fun/api/v1

      - name: Verify release signatures
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tee /tmp/aab-signature.txt
          grep -q '^jar verified\.$' /tmp/aab-signature.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Name public tester APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk fastlearn-mobile-latest.apk
          sha256sum fastlearn-mobile-latest.apk > fastlearn-mobile-latest.apk.sha256

      - name: Publish tester APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: FastLearn Mobile v0.1.${{ github.run_number }}
          body: |
            Early-access Android build from `${{ github.sha }}`.
            Download `fastlearn-mobile-latest.apk` below and allow installation from your browser when Android asks.
          files: |
            fastlearn-mobile-latest.apk
            fastlearn-mobile-latest.apk.sha256
          make_latest: true
